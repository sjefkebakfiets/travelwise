name: Publish Docker images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image version
        required: true
        default: "0.2.0"
        type: string
      publish:
        description: Explicitly approve private GHCR image publication
        required: true
        default: false
        type: boolean
concurrency:
  group: publish-images
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run test:db
      - run: npm run test:docker
      - name: Publish verified images
        if: inputs.publish
        env:
          PUBLISH_IMAGES: "true"
          IMAGE_TAG: ${{ inputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-images.mjs
