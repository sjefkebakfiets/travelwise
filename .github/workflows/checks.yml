name: Checks
on: [push, pull_request]
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:docker

  github-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Docker build from public GitHub source
        env:
          DOCKER_BUILD_CONTEXT: https://github.com/sjefkebakfiets/travelwise.git#${{ github.sha }}
        run: node scripts/test-docker-distribution.mjs
