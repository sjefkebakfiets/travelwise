name: travelwise
services:
  travelwise-app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "${TRAVELWISE_PORT:-3006}:3000"
    environment:
      DATABASE_URL: postgresql://travelwise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@travelwise-db:5432/travelwise
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      UPLOAD_DIR: /data/uploads
    volumes:
      - /mnt/raid-z-1/apps/dockge/data/travelwise/uploads:/data/uploads
    depends_on:
      travelwise-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  travelwise-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travelwise
      POSTGRES_DB: travelwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - /mnt/raid-z-1/apps/dockge/data/travelwise/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelwise -d travelwise"]
      interval: 10s
      timeout: 5s
      retries: 5
